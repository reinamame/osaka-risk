<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>地形の詳しい情報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- このページ専用のスタイル -->
  <style>
    /* ===== 全体レイアウト ===== */
    body.terrain-detail-page {
      min-height: 100vh;
      margin: 0;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      line-height: 1.7;
    }

    .tdp-header {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.2rem 1.5rem 0.4rem;
    }

    .tdp-back {
      text-decoration: none;
      font-size: 0.9rem;
      color: #555;
    }
    .tdp-back:hover {
      text-decoration: underline;
    }

    .tdp-main {
      max-width: 960px;
      margin: 0 auto 2rem;
      padding: 0 1.5rem 2rem;
    }

    /* ===== カード共通 ===== */
    .tdp-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    /* タイトルカード */
    .tdp-card-hero {
      border-left: 5px solid #1976d2;
    }

    .tdp-tag {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1976d2;
      margin: 0 0 .2rem;
    }

    .tdp-title {
      font-size: 1.8rem;
      margin: 0 0 .3rem;
    }

    .tdp-subtitle {
      margin: 0;
      color: #555;
    }

    /* セクション見出し */
    .tdp-section-title {
      font-size: 1.1rem;
      margin: 0 0 .4rem;
    }

    /* 箇条書き共通 */
    .tdp-list {
      margin: 0;
      padding-left: 1.2rem;
    }
    .tdp-list li {
      margin-bottom: .25rem;
    }

    /* ===== 3モードのグリッド ===== */
    .tdp-mode-grid {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 900px) {
      .tdp-mode-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* モードごとのアクセントカラー */
    .tdp-mode-bousai {
      border-top: 4px solid #e53935;
    }
    .tdp-mode-tourism {
      border-top: 4px solid #fb8c00;
    }
    .tdp-mode-edu {
      border-top: 4px solid #1e88e5;
    }
  </style>
</head>

<body class="terrain-detail-page">
  <header class="tdp-header">
    <a href="/" class="tdp-back">← 地図に戻る</a>
  </header>

  <main class="tdp-main">
    <!-- タイトルカード -->
    <section class="tdp-card tdp-card-hero">
      <p class="tdp-tag">地形詳細</p>
      <h1 id="terrainTitle" class="tdp-title">地形の詳しい情報</h1>
      <p id="terrainSubtitle" class="tdp-subtitle"></p>
    </section>

    <!-- ポイント -->
    <section class="tdp-card">
      <h2 class="tdp-section-title">この地形のポイント</h2>
      <ul id="terrainPoints" class="tdp-list"></ul>
    </section>

    <!-- 防災 / 観光 / 教育 の3カード -->
    <section class="tdp-mode-grid">
      <article class="tdp-card tdp-mode tdp-mode-bousai">
        <h2 class="tdp-section-title">防災モード</h2>
        <ul id="terrainBousai" class="tdp-list"></ul>
      </article>

      <article class="tdp-card tdp-mode tdp-mode-tourism">
        <h2 class="tdp-section-title">観光モード</h2>
        <ul id="terrainTourism" class="tdp-list"></ul>
      </article>

      <article class="tdp-card tdp-mode tdp-mode-edu">
        <h2 class="tdp-section-title">教育モード（成り立ち）</h2>
        <ul id="terrainEducation" class="tdp-list"></ul>
      </article>
    </section>
  </main>

  <script type="module" src="/JS/terrain_detail_page.js"></script>
</body>
</html>
